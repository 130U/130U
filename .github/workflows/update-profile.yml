name: Update profile contributions

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".github/workflows/update-profile.yml"
      - "assets/ledger/**"
      - "config/**"
      - "scripts/**"
      - "tests/**"
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-contributions
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Test profile generator
        run: python -m unittest discover -s tests -v

      - name: Generate live profile assets
        run: python scripts/generate_profile.py --live

      - name: Validate profile
        run: python scripts/validate_profile.py

      - name: Commit updated contributions
        shell: bash
        run: |
          if git diff --quiet -- assets/generated config/profile.json; then
            echo "Profile contributions are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated config/profile.json
          git commit -m "chore: refresh GitHub contributions"
          git push
