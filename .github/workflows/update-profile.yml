name: Update profile contributions

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".github/workflows/update-profile.yml"
      - "profile.config.json"
      - "scripts/**"
      - "tests/**"
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-telemetry
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test profile generator
        run: python -m unittest discover -s tests -v

      - name: Generate live profile assets
        run: python scripts/generate_profile.py --live

      - name: Validate profile
        run: python scripts/validate_profile.py

      - name: Commit updated contributions
        shell: bash
        run: |
          if git diff --quiet -- assets/generated profile.config.json; then
            echo "Profile contributions are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated profile.config.json
          git commit -m "chore: refresh GitHub contributions"
          git push
