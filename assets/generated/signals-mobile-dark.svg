    @keyframes nodePulse { 0%,100% { opacity:.72; transform:scale(1); } 50% { opacity:1; transform:scale(1.16); } }
    @keyframes researchSweep { to { transform:rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
